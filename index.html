<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sorteo Teams</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px; width: 100%; max-width: 1000px; margin-bottom: 60px; }
        .person { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 18px; }
        
        /* Estilo del Switch */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #fff; }
        input:checked + .slider:before { transform: translateX(20px); background-color: #000; }

        /* Controles */
        .winner-display { margin-bottom: 20px; color: #888; font-size: 18px; }
        .controls { display: flex; gap: 20px; }
        button { padding: 10px 20px; cursor: pointer; background: transparent; color: #fff; border: 1px solid #fff; border-radius: 20px; font-size: 14px; transition: 0.3s; }
        button:hover { background: #fff; color: #000; }
    </style>
</head>
